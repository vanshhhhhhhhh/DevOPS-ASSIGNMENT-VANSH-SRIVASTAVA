# Source: course repo Nency-Ravaliya/devops-heros, session10-k8s-core-objects (MIT).
# Changes: removed the fixed nodePort so Kubernetes picks a free one (shared cluster).
# service-green.yaml — Service pointing to GREEN (v2) — SWITCHED traffic
# Apply this to promote GREEN and route ALL traffic to v2 instantly
apiVersion: v1
kind: Service
metadata:
  name: myapp-service
  labels:
    app: myapp
spec:
  type: NodePort
  # THE SWITCH: Selector flipped to green — all traffic now goes to v2
  selector:
    app: myapp
    slot: green    # <-- NOW routing to GREEN (v2)
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
