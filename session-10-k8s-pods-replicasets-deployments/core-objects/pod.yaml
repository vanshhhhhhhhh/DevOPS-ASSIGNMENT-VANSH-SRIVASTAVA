# Source: course repo Nency-Ravaliya/devops-heros, session10-k8s-core-objects (MIT).
# Changes: image pulled from public.ecr.aws/docker/library (AWS mirror of the same Docker Hub official image; Docker Hub returned 429 Too Many Requests).
apiVersion: v1
kind: Pod
metadata:
  name: yatri-demo-pod
  labels:
    app: yatri-demo
    tier: frontend
spec:
  containers:
    - name: nginx-container
      image: public.ecr.aws/docker/library/nginx:1.25-alpine
      ports:
        - containerPort: 80
      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          cpu: "200m"
          memory: "128Mi"
