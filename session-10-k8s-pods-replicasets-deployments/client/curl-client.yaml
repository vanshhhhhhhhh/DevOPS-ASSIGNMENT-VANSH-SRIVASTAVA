# Small client Pod I use to send HTTP requests to the Services from inside the cluster
# (the minikube node IP is not reachable from macOS with the docker driver).
apiVersion: v1
kind: Namespace
metadata:
  name: s10-client
---
apiVersion: v1
kind: Pod
metadata:
  name: curl-client
  namespace: s10-client
  labels:
    app: curl-client
spec:
  containers:
    - name: curl
      image: quay.io/curl/curl:8.5.0
      command: ["sh", "-c", "sleep 7200"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
