# Source: course repo Nency-Ravaliya/devops-heros, session10-k8s-core-objects (MIT).
# Changes: image pulled from public.ecr.aws/docker/library (AWS mirror of the same Docker Hub official image; Docker Hub returned 429 Too Many Requests).
apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-liveness
spec:
  containers:
    - name: app
      image: public.ecr.aws/docker/library/busybox:1.36
      command: ["sh", "-c", "echo 'App started'; touch /tmp/healthy; sleep 20; rm /tmp/healthy; echo 'Health file removed'; sleep 300"]
      livenessProbe:
        exec:
          command: ["sh", "-c", "test -f /tmp/healthy"]
        initialDelaySeconds: 5
        periodSeconds: 5
        failureThreshold: 2
