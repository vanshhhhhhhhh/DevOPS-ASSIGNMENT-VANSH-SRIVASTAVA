# Adapted from the course repo (Nency-Ravaliya/devops-heros,
# session20-monitoring-observability-gitops/02-metrics-logs-traces/k8s-demo/deployment.yaml):
# same busybox "log emitter", but in my own namespace, with small resource
# requests, and printing structured (JSON) log lines that carry a request id.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s20-obs-demo
  namespace: s20-observability
  labels:
    app: s20-obs-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: s20-obs-demo
  template:
    metadata:
      labels:
        app: s20-obs-demo
    spec:
      containers:
        - name: app
          image: public.ecr.aws/docker/library/busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo '{"level":"INFO","msg":"Session 20 observability demo started"}'
              i=0
              while true; do
                i=$((i+1))
                echo "{\"level\":\"INFO\",\"msg\":\"Request received\",\"request_no\":$i,\"trace_id\":\"$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')\"}"
                echo "{\"level\":\"INFO\",\"msg\":\"Health check OK\",\"request_no\":$i}"
                sleep 10
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
