# Rehearsal only: a tiny in-cluster Helm chart repository (busybox httpd serving
# index.yaml + the packaged chart from a ConfigMap). It lets Argo CD sync the same
# manifests as app/ before the GitHub repo exists. Not used by the real demo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s20-chartrepo
  namespace: s20-gitops-chartrepo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: s20-chartrepo
  template:
    metadata:
      labels:
        app: s20-chartrepo
    spec:
      containers:
        - name: httpd
          image: public.ecr.aws/docker/library/busybox:1.36
          command: ["httpd", "-f", "-v", "-p", "8080", "-h", "/srv"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: repo
              mountPath: /srv
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 50m, memory: 32Mi}
      volumes:
        - name: repo
          configMap:
            name: s20-chartrepo
---
apiVersion: v1
kind: Service
metadata:
  name: s20-chartrepo
  namespace: s20-gitops-chartrepo
spec:
  selector:
    app: s20-chartrepo
  ports:
    - port: 8080
      targetPort: 8080
