# Load generator based on the course command in 04-hpa/readme1.md:
#   kubectl run load-generator --image=busybox:1.36 --restart=Never -- /bin/sh -c "while true; do wget -q -O- http://hpa-demo-service; done"
# Changes:
#  - a Deployment, so I can increase the load by scaling it
#    (kubectl scale deploy/load-generator --replicas=N) and stop it by deleting it
#  - it calls the Service ClusterIP from the env var Kubernetes injects
#    (HPA_DEMO_SERVICE_SERVICE_HOST) instead of the DNS name. In my first run every
#    wget did a DNS lookup and CoreDNS (shared by everyone on the cluster) went to ~200m CPU.
#  - 5 URLs per wget call, so less CPU is wasted on starting wget processes
#  - image from the ECR Public mirror of the official busybox image (Docker Hub rate limit)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: s13-hpa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
        - name: busybox
          image: public.ecr.aws/docker/library/busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              U="http://${HPA_DEMO_SERVICE_SERVICE_HOST}:${HPA_DEMO_SERVICE_SERVICE_PORT}/"
              echo "sending requests to $U"
              while true; do wget -q -O /dev/null "$U" "$U" "$U" "$U" "$U"; done
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: 250m
              memory: 32Mi
