# Dynamic provisioning (course 03-storageclass/pvc.yaml): no PV is created by hand.
# The "standard" StorageClass (provisioner k8s.io/minikube-hostpath) creates one.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dynamic-pvc
  namespace: s13-volumes
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 500Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: dynamic-demo
  namespace: s13-volumes
spec:
  containers:
    - name: app
      image: public.ecr.aws/docker/library/busybox:1.36
      command: ["sh", "-c", "echo 'written to a dynamically provisioned volume' > /data/hello.txt; sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 50m, memory: 32Mi}
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: dynamic-pvc
