# Static provisioning: an admin creates the PV by hand (course 02-persistent-storage/pv.yaml).
# Changes:
#  - name s13-student-pv (PVs are cluster-scoped and the cluster is shared)
#  - storageClassName: "" so only a PVC that also asks for "no class" can bind it
#    (see README: with the course files the PVC got the default class and did NOT bind here)
#  - claimRef reserves this PV for my PVC only, so no other PVC on the cluster can take it
apiVersion: v1
kind: PersistentVolume
metadata:
  name: s13-student-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: s13-volumes
    name: student-pvc
  hostPath:
    path: /tmp/s13-student-data
    type: DirectoryOrCreate
