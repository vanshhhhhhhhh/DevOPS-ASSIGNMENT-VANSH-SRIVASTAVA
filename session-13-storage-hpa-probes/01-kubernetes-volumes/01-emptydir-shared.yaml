# emptyDir shared by two containers in one Pod (extends the course file 01-volumes/emptydir-pod.yaml).
# "writer" appends a line to /data/index.html every 5 s, "web" (nginx) serves the same
# directory. The emptyDir is created empty when the Pod starts and deleted with the Pod.
apiVersion: v1
kind: Pod
metadata:
  name: emptydir-demo
  namespace: s13-volumes
spec:
  containers:
    - name: writer
      image: public.ecr.aws/docker/library/busybox:1.36
      command: ["sh", "-c"]
      args:
        - |
          echo "<h1>emptyDir demo, pod $(hostname)</h1>" > /data/index.html
          while true; do echo "<p>writer: $(date -u +%H:%M:%S)</p>" >> /data/index.html; sleep 5; done
      volumeMounts:
        - name: shared
          mountPath: /data
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 50m, memory: 32Mi}
    - name: web
      image: public.ecr.aws/docker/library/nginx:1.27
      volumeMounts:
        - name: shared
          mountPath: /usr/share/nginx/html
          readOnly: true
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {cpu: 100m, memory: 64Mi}
  volumes:
    - name: shared
      emptyDir: {}
