# My own StorageClass (cluster-scoped, so prefixed s13-). Same minikube provisioner as
# "standard", but volumeBindingMode WaitForFirstConsumer: the PV is only created once a
# Pod that uses the PVC is scheduled (on a real multi-zone cluster this makes the disk get
# created in the same zone as the Pod). reclaimPolicy Delete removes the PV with the PVC.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: s13-wffc
provisioner: k8s.io/minikube-hostpath
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wffc-pvc
  namespace: s13-volumes
spec:
  storageClassName: s13-wffc
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
