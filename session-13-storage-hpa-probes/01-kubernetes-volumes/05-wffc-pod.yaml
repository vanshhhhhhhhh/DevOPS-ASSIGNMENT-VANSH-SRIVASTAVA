apiVersion: v1
kind: Pod
metadata:
  name: wffc-demo
  namespace: s13-volumes
spec:
  containers:
    - name: app
      image: public.ecr.aws/docker/library/busybox:1.36
      command: ["sh", "-c", "df -h /data; sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 50m, memory: 32Mi}
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: wffc-pvc
