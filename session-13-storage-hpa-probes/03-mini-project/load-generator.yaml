# Load generator for mini-project Task 3. The course runs:
#   kubectl run load-generator -n production-webapp --image=busybox:1.36 --restart=Never \
#     -- /bin/sh -c "while true; do wget -q -O- http://web-service; done"
# Same idea as a manifest, with: ECR busybox image, a CPU limit so it cannot take more than
# one core of the shared node, and the Service ClusterIP from the injected env var instead of
# the DNS name (no DNS lookup per request, keeps the shared CoreDNS quiet).
apiVersion: v1
kind: Pod
metadata:
  name: load-generator
  namespace: s13-production-webapp
spec:
  restartPolicy: Never
  containers:
    - name: busybox
      image: public.ecr.aws/docker/library/busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          U="http://${WEB_SERVICE_SERVICE_HOST}:${WEB_SERVICE_SERVICE_PORT}/"
          echo "sending requests to $U"
          while true; do wget -q -O /dev/null "$U" "$U" "$U" "$U" "$U"; done
      resources:
        requests:
          cpu: 100m
          memory: 16Mi
        limits:
          cpu: "1"
          memory: 32Mi
