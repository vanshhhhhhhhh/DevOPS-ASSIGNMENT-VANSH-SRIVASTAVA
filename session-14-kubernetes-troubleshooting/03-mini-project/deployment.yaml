# Copied from the course repo session-14-kubernetes-troubleshooting/mini-project/deployment.yaml.
# Change: image from the ECR Public mirror (Docker Hub rate limit). Namespace given with -n s14-mini.
apiVersion: apps/v1
kind: Deployment

metadata:
  name: troubleshooting-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: troubleshooting-app

  template:
    metadata:
      labels:
        app: troubleshooting-app

    spec:
      containers:
        - name: app
          image: public.ecr.aws/docker/library/nginx:1.27

          ports:
            - containerPort: 80
