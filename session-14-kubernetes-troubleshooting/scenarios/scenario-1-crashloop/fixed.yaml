# Final fix (mine): DATABASE_URL is set AND the process keeps running like a real server.
# A Pod's default restartPolicy is Always, so a container that exits - even with code 0 -
# is restarted, and repeated exits also end in CrashLoopBackOff.
apiVersion: v1
kind: Pod
metadata:
  name: fail-1-crashloop-pod
  labels:
    tier: triage-gauntlet
    scenario: crashloop
spec:
  containers:
    - name: python-app
      image: public.ecr.aws/docker/library/python:3.11-alpine
      env:
        - name: DATABASE_URL
          value: "postgresql://demo_user@postgres-db:5432/demo_db"
      command:
        - "python3"
        - "-u"
        - "-c"
        - |
          import os, sys, time
          db_url = os.environ.get("DATABASE_URL")
          if not db_url:
              print("[FATAL ERROR]: DATABASE_URL environment variable is MISSING!", file=sys.stderr)
              sys.exit(1)
          print("Application started successfully!")
          while True:          # stand-in for the real server loop
              time.sleep(3600)
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 100m, memory: 64Mi}
