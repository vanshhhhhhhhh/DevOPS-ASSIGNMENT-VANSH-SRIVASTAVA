# Pod that mounts a ConfigMap and a Secret as volumes. Neither object exists yet, so the
# kubelet cannot set up the volumes and the Pod stays in ContainerCreating.
apiVersion: v1
kind: Pod
metadata:
  name: report-app
  namespace: s14-containercreating
spec:
  containers:
    - name: app
      image: public.ecr.aws/docker/library/busybox:1.36
      command: ["sh", "-c", "cat /etc/report/settings.conf; ls /etc/report-tls; sleep 3600"]
      volumeMounts:
        - name: settings
          mountPath: /etc/report
        - name: tls
          mountPath: /etc/report-tls
          readOnly: true
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 50m, memory: 32Mi}
  volumes:
    - name: settings
      configMap:
        name: report-settings
    - name: tls
      secret:
        secretName: report-tls
