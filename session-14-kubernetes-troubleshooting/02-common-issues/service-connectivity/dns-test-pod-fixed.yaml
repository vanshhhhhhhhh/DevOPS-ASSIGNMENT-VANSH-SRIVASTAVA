# Fixed dns-test pod: the image that exists is "jessie-dnsutils" (the one used in the
# Kubernetes DNS debugging docs). It contains nslookup and dig.
apiVersion: v1
kind: Pod
metadata:
  name: dns-test
spec:
  containers:
    - name: dns-test
      image: registry.k8s.io/e2e-test-images/jessie-dnsutils:1.3
      command:
        - sleep
        - "3600"
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 50m, memory: 64Mi}
