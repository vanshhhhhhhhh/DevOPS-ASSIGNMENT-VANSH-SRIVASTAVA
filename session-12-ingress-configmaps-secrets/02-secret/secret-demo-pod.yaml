# Pod that consumes the Secret yatri-db-secret in two ways:
#  - env.valueFrom.secretKeyRef: single keys as environment variables
#  - volume: every key becomes a read-only file under /etc/db-credentials (tmpfs, mode 0400)
apiVersion: v1
kind: Pod
metadata:
  name: secret-demo
  namespace: s12-demo
  labels:
    app: secret-demo
spec:
  containers:
    - name: app
      image: public.ecr.aws/docker/library/busybox:1.36
      command: ["sh", "-c", "echo started; sleep 3600"]
      env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: yatri-db-secret
              key: POSTGRES_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: yatri-db-secret
              key: POSTGRES_PASSWORD
      volumeMounts:
        - name: db-credentials
          mountPath: /etc/db-credentials
          readOnly: true
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
  volumes:
    - name: db-credentials
      secret:
        secretName: yatri-db-secret
        defaultMode: 0400
