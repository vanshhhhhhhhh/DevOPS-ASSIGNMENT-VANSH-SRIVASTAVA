# DEMO ONLY - every value in this file is fake and safe to commit.
# The real Secret is never stored in Git; it is created directly in the cluster with
#   kubectl create secret generic yatri-db-secret --from-literal=... (see README, Task 2)
# stringData lets me write plain text; the API server stores it base64-encoded under .data
apiVersion: v1
kind: Secret
metadata:
  name: yatri-db-secret-demo
  namespace: s12-demo
  labels:
    app: yatri-app
type: Opaque
stringData:
  POSTGRES_USER: demo_user
  POSTGRES_PASSWORD: demo-password-123
  POSTGRES_DB: demo_db
