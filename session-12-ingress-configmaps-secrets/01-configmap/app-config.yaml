# Two ConfigMaps for the "Yatri" booking app used in this session.
# 1) yatri-app-config: plain KEY=VALUE settings, consumed as environment variables.
#    The keys are the same as in the course file 04-full-demo/configmap.yaml.
# 2) yatri-app-files: file-style keys, consumed as a volume (each key becomes a file).
apiVersion: v1
kind: ConfigMap
metadata:
  name: yatri-app-config
  namespace: s12-demo
  labels:
    app: yatri-app
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  APP_PORT: "5000"
  DEFAULT_CURRENCY: "INR"
  MAX_BOOKING_DAYS: "30"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: yatri-app-files
  namespace: s12-demo
  labels:
    app: yatri-app
data:
  theme.txt: |
    theme_color=teal
  app.properties: |
    feature.dark_mode=true
    cache.ttl_seconds=300
    booking.max_passengers=6
