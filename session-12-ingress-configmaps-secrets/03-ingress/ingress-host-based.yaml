# Host-based routing: the Host header decides the backend.
#   web.s12.local -> frontend,   api.s12.local -> backend
# No rewrite here: the backend receives the original path.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: yatri-host-ingress
  namespace: s12-demo
  labels:
    app: yatri-app
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: web.s12.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: yatri-frontend-service
                port:
                  number: 80
    - host: api.s12.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: yatri-backend-service
                port:
                  number: 80
