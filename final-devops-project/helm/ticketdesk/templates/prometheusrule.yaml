{{- if .Values.metrics.prometheusRule.enabled }}
# Same alert rules as monitoring/prometheus-values.yaml, as a Prometheus Operator CRD.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "ticketdesk.fullname" . }}
  labels:
    {{- include "ticketdesk.labels" . | nindent 4 }}
    {{- with .Values.metrics.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: ticketdesk
      rules:
        - alert: TicketDeskBackendDown
          expr: up{job=~".*ticketdesk-backend"} == 0
          for: 1m
          labels: { severity: critical }
          annotations:
            summary: "TicketDesk backend target {{`{{ $labels.instance }}`}} is down"
        - alert: TicketDeskHighErrorRate
          expr: sum(rate(http_requests_total{job=~".*ticketdesk-backend",status="5xx"}[5m])) / clamp_min(sum(rate(http_requests_total{job=~".*ticketdesk-backend"}[5m])), 1e-9) > 0.05
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "More than 5% of TicketDesk API requests fail with 5xx"
        - alert: TicketDeskSlowRequests
          expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job=~".*ticketdesk-backend"}[5m]))) > 0.5
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "TicketDesk API p95 latency is above 500 ms"
{{- end }}
