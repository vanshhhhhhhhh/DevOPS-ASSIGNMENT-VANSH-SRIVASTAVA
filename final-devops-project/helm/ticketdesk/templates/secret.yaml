{{- if not .Values.postgres.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ticketdesk.fullname" . }}-db
  labels:
    {{- include "ticketdesk.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_PASSWORD: {{ required "postgres.password is required when postgres.existingSecret is empty" .Values.postgres.password | quote }}
{{- end }}
