apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ticketdesk.fullname" . }}-config
  labels:
    {{- include "ticketdesk.labels" . | nindent 4 }}
data:
  DB_HOST: {{ include "ticketdesk.fullname" . }}-postgres
  DB_PORT: "5432"
  DB_NAME: {{ .Values.postgres.database | quote }}
  DB_USER: {{ .Values.postgres.username | quote }}
  ENVIRONMENT: {{ .Values.environment | quote }}
  LOG_LEVEL: {{ .Values.backend.logLevel | quote }}
