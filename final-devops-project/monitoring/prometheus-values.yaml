# Lean Prometheus for the final project (chart: oci://ghcr.io/prometheus-community/charts/prometheus, 29.x).
#   helm upgrade --install final-prometheus oci://ghcr.io/prometheus-community/charts/prometheus \
#     --version 29.36.0 -n final-monitoring --create-namespace -f monitoring/prometheus-values.yaml
# Only the Prometheus server is installed: no Alertmanager, node-exporter,
# kube-state-metrics or pushgateway (the node is shared and memory is tight).
# The app is scraped through pod annotations (prometheus.io/scrape|port|path).

alertmanager:
  enabled: false
kube-state-metrics:
  enabled: false
prometheus-node-exporter:
  enabled: false
prometheus-pushgateway:
  enabled: false

server:
  retention: 2d
  global:
    scrape_interval: 15s
    evaluation_interval: 15s
  persistentVolume:
    enabled: false
  resources:
    requests: { cpu: 50m, memory: 192Mi }
    limits: { cpu: 500m, memory: 512Mi }

# Turn off the chart's cluster-wide default jobs; keep only self-monitoring
# and add one job for the TicketDesk backend pods.
scrapeConfigs:
  kubernetes-api-servers: { enabled: false }
  kubernetes-nodes: { enabled: false }
  kubernetes-nodes-cadvisor: { enabled: false }
  kubernetes-service-endpoints: { enabled: false }
  kubernetes-service-endpoints-slow: { enabled: false }
  prometheus-pushgateway: { enabled: false }
  kubernetes-services: { enabled: false }
  kubernetes-pods: { enabled: false }
  kubernetes-pods-slow: { enabled: false }
  ticketdesk-backend:
    enabled: true
    job_name: ticketdesk-backend
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [final-app, final-k8s, final-troubleshoot]
    relabel_configs:
      # keep only pods that opt in with prometheus.io/scrape: "true"
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: (.+);(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance]
        target_label: release

serverFiles:
  alerting_rules.yml:
    groups:
      - name: ticketdesk
        rules:
          - alert: TicketDeskBackendDown
            expr: up{job="ticketdesk-backend"} == 0
            for: 1m
            labels: { severity: critical }
            annotations:
              summary: "TicketDesk backend pod {{ $labels.pod }} ({{ $labels.namespace }}) is not answering /metrics"
          - alert: TicketDeskNoBackendTargets
            expr: absent(up{job="ticketdesk-backend"})
            for: 2m
            labels: { severity: critical }
            annotations:
              summary: "Prometheus has no TicketDesk backend target at all"
          - alert: TicketDeskHighErrorRate
            expr: |
              sum by (namespace) (rate(http_requests_total{job="ticketdesk-backend",status="5xx"}[5m]))
                / clamp_min(sum by (namespace) (rate(http_requests_total{job="ticketdesk-backend"}[5m])), 1e-9) > 0.05
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: "More than 5% of TicketDesk API requests in {{ $labels.namespace }} return 5xx"
          - alert: TicketDeskSlowRequests
            expr: |
              histogram_quantile(0.95, sum by (le, namespace) (rate(http_request_duration_seconds_bucket{job="ticketdesk-backend"}[5m]))) > 0.5
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "TicketDesk API p95 latency in {{ $labels.namespace }} is above 500 ms"
          - alert: TicketDeskUrgentTicketSpike
            expr: sum by (namespace) (increase(ticketdesk_tickets_created_total{priority="URGENT"}[10m])) > 10
            for: 1m
            labels: { severity: warning }
            annotations:
              summary: "More than 10 URGENT tickets were opened in {{ $labels.namespace }} in the last 10 minutes"
