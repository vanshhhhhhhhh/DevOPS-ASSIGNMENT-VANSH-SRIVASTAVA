# Deployed by the "deploy" job of .github/workflows/session-16-cicd.yml into a throwaway kind cluster.
# The image below is the local tag; the job renders a copy with the image it just built (sed on the image: line).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s16-cicd-demo
  labels:
    app: s16-cicd-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: s16-cicd-demo
  template:
    metadata:
      labels:
        app: s16-cicd-demo
    spec:
      containers:
        - name: app
          image: s16-cicd-demo:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
