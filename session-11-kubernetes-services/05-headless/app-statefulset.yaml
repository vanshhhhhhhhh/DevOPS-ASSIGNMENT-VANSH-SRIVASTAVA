# Source: course repo Nency-Ravaliya/devops-heros, session-11-kubernetes-services (MIT).
# Changes: image pulled from public.ecr.aws/docker/library or quay.io/curl (same images; Docker Hub returned 429 Too Many Requests).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: web-stateful
  labels:
    app: web-headless
spec:
  serviceName: web-service-headless
  replicas: 3
  selector:
    matchLabels:
      app: web-headless
  template:
    metadata:
      labels:
        app: web-headless
    spec:
      containers:
        - name: nginx-stateful
          image: public.ecr.aws/docker/library/nginx:1.25-alpine
          ports:
            - name: web
              containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
