# Source: course repo Nency-Ravaliya/devops-heros, session-11-kubernetes-services (MIT).
# Changes: removed the fixed nodePort 30080 so Kubernetes picks a free port in 30000-32767 (shared cluster).
apiVersion: v1
kind: Service
metadata:
  name: web-service-nodeport
  labels:
    app: web-nodeport
spec:
  type: NodePort
  selector:
    app: web-nodeport
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
