# Source: course repo Nency-Ravaliya/devops-heros, session-11-kubernetes-services (MIT).
# Changes: image pulled from public.ecr.aws/docker/library or quay.io/curl (same images; Docker Hub returned 429 Too Many Requests).
apiVersion: v1
kind: Pod
metadata:
  name: curl-client
  labels:
    app: curl-client
spec:
  containers:
    - name: client
      image: quay.io/curl/curl:8.5.0
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests:
          cpu: "10m"
          memory: "32Mi"
