# Deployment -> manages ReplicaSets -> which manage Pods.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cmp-deploy
  labels:
    app: cmp-deploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cmp-deploy
  template:
    metadata:
      labels:
        app: cmp-deploy
    spec:
      containers:
        - name: web
          image: public.ecr.aws/docker/library/nginx:1.24-alpine
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
