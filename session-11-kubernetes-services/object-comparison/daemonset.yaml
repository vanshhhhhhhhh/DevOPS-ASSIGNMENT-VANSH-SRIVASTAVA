# One Pod per node (this cluster has one node, so one Pod).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cmp-ds
  labels:
    app: cmp-ds
spec:
  selector:
    matchLabels:
      app: cmp-ds
  template:
    metadata:
      labels:
        app: cmp-ds
    spec:
      containers:
        - name: agent
          image: public.ecr.aws/docker/library/busybox:1.36
          command: ["sh", "-c", "while true; do echo agent on node $NODE_NAME; sleep 30; done"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 50m, memory: 32Mi}
