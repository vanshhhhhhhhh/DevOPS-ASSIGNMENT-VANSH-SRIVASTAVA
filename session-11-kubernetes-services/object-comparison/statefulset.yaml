# StatefulSet + the headless Service it needs + one PVC per Pod.
apiVersion: v1
kind: Service
metadata:
  name: cmp-sts
spec:
  clusterIP: None
  selector:
    app: cmp-sts
  ports:
    - name: http
      port: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cmp-sts
spec:
  serviceName: cmp-sts
  replicas: 2
  selector:
    matchLabels:
      app: cmp-sts
  template:
    metadata:
      labels:
        app: cmp-sts
    spec:
      containers:
        - name: web
          image: public.ecr.aws/docker/library/nginx:1.24-alpine
          volumeMounts:
            - name: data
              mountPath: /usr/share/nginx/html
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 16Mi
