server {
    listen 80;

    # A tiny "API" implemented in nginx itself. It reports which container answered
    # and which client address the request came from.
    location /api/status {
        default_type application/json;
        return 200 '{"service":"backend","container":"$hostname","client_ip":"$remote_addr","database_host":"s08-database:3306","time":"$time_iso8601"}\n';
    }

    location / {
        default_type text/plain;
        return 200 "Hello from the backend container ($hostname)\n";
    }
}
