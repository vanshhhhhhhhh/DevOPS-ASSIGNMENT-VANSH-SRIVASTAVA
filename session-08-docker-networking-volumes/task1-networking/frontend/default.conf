server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Forward API calls to the backend container. "s08-backend" is resolved by
    # Docker's embedded DNS server (127.0.0.11) because both containers share s08-frontend-net.
    location /api/ {
        proxy_pass http://s08-backend:80/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
